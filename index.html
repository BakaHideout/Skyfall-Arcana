<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyfall Arcana has moved</title>
<meta http-equiv="refresh" content="1; url=https://skyfallarcana.github.io/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f151c;color:#f6ead2;font:18px system-ui,sans-serif;text-align:center;padding:24px}a{color:#f2cf7c}</style>
</head>
<body>
<p>Skyfall Arcana has a new home.<br>Taking you to <a href="https://skyfallarcana.github.io/">skyfallarcana.github.io</a>…</p>
<script>
if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()))}
if(window.caches){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)))}
setTimeout(()=>location.replace("https://skyfallarcana.github.io/"),300);
</script>
</body>
</html>
